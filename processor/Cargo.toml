[package]
name = "cdk-branch-processor"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "Custom cdk payment processor for the 'branch' method (manual cash settlement of a custom unit) plus an operator web UI. Built against stock cdk via gRPC."
repository = "https://github.com/cashubtc/cdk"

[[bin]]
name = "cdk-branch-processor"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# cdk is consumed unmodified from upstream, pinned to the latest stable release
# commit. The payment-processor APIs used here propagate quote_id, which lets
# this backend correlate `get_payment_quote` with `make_payment` without
# relying on wallet-supplied uniqueness — see src/backend.rs.
#
# The payment-processor protocol version check is strict-equality, so the mint
# (cdk-mintd) MUST be built from this same rev. The Dockerfile installs
# cdk-mintd from CDK_REV; keep the two in sync.
# ---------------------------------------------------------------------------
[dependencies]
cdk-common = { git = "https://github.com/cashubtc/cdk", rev = "6132607495ae0741e412a63f2acc34e4ccddfc55", default-features = false, features = ["mint", "grpc"] }
cdk-payment-processor = { git = "https://github.com/cashubtc/cdk", rev = "6132607495ae0741e412a63f2acc34e4ccddfc55", default-features = false }
cdk-mint-rpc = { git = "https://github.com/cashubtc/cdk", rev = "6132607495ae0741e412a63f2acc34e4ccddfc55" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8.1"
bip39 = { version = "2.2.2", features = ["rand"] }
bitcoin_hashes = "0.14.1"
futures = { version = "0.3.28", default-features = false, features = ["async-await"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time"] }
tokio-stream = { version = "0.1.15", features = ["sync"] }
tonic = { version = "0.14.2", default-features = false, features = ["transport", "tls-ring", "codegen", "router"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.17", features = ["v4", "serde"] }

[profile.release]
# keep the demo image small; the processor is not perf-sensitive
strip = true
