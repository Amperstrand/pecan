[package]
name = "cdk-branch-processor"
version = "0.2.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "cdk payment processor for the 'branch' method (manual cash settlement at a counter) plus a teller/operator web UI. Attaches to one existing cdk-mintd over the stock gRPC payment-processor interface."
repository = "https://github.com/cashubtc/cdk"

[[bin]]
name = "cdk-branch-processor"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# cdk is consumed unmodified. The pin is the head of PR cashubtc/cdk#2295
# ("propagate quote_id and pubkey on custom mint quotes") — the one upstream
# change this processor depends on. Once the PR merges, repoint these git deps
# (and COMPATIBLE_CDK_REV in src/config.rs, and docker/mintd/Dockerfile) at
# the cashubtc merge commit or release tag.
#
# The payment-processor protocol version check is strict-equality ("4.0.0" at
# this rev), so the attached cdk-mintd MUST be built from the same rev.
# ---------------------------------------------------------------------------
[dependencies]
cdk-common = { git = "https://github.com/zeugmaster/cdk", rev = "f3478044380d057d337174d7c6631ffc3159bf2c", default-features = false, features = ["mint", "grpc"] }
cdk-payment-processor = { git = "https://github.com/zeugmaster/cdk", rev = "f3478044380d057d337174d7c6631ffc3159bf2c", default-features = false }

anyhow = "1"
async-trait = "0.1"
axum = "0.8.1"
bitcoin_hashes = "0.14.1"
futures = { version = "0.3.28", default-features = false, features = ["async-await"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time"] }
tokio-stream = { version = "0.1.15", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.17", features = ["v4", "serde"] }

[profile.release]
# keep the image small; the processor is not perf-sensitive
strip = true
