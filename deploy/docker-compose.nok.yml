services:
  pecan:
    image: pecan:deployment
    command: ["cdk-branch-processor"]
    network_mode: host
    environment:
      RUST_LOG: "info,cdk_payment_processor=info"
      CDK_BRANCH_PROCESSOR_WORK_DIR: /var/lib/cdk-branch-processor
      CDK_BRANCH_PROCESSOR_CONFIG_DIR: /var/lib/pecan/config
      CDK_BRANCH_PROCESSOR_GRPC_ADDR: "127.0.0.1"
      CDK_BRANCH_PROCESSOR_GRPC_PORT: "50057"
      CDK_BRANCH_PROCESSOR_HTTP_ADDR: "127.0.0.1"
      CDK_BRANCH_PROCESSOR_HTTP_PORT: "9097"
      CDK_BRANCH_PROCESSOR_INITIAL_UNIT: "nok"
      CDK_BRANCH_PROCESSOR_INITIAL_MINT_URL: "http://127.0.0.1:8098"
      CDK_BRANCH_PROCESSOR_INITIAL_ADVERTISED_GRPC: "127.0.0.1:50057"
      CDK_BRANCH_PROCESSOR_LN: "true"
      CDK_BRANCH_PROCESSOR_CLN_SOCKET: "/run/pecan-cln/signet/lightning-rpc"
      CDK_BRANCH_PROCESSOR_LN_MARKUP_PERCENT: "10"
      CDK_BRANCH_PROCESSOR_ONCHAIN: "true"
      CDK_BRANCH_PROCESSOR_ONCHAIN_CONFIRMATIONS: "0"
      CDK_BRANCH_PROCESSOR_BITCOIND_RPC: "${PECAN_BITCOIND_RPC:-http://46.224.104.12:38332}"
      CDK_BRANCH_PROCESSOR_BITCOIND_USER: "${PECAN_BITCOIND_USER:-pecan-watch}"
      CDK_BRANCH_PROCESSOR_BITCOIND_PASS: "${PECAN_BITCOIND_PASS:?set in .env}"
      CDK_BRANCH_PROCESSOR_PAYOUT_RAILS: "sim,sepa,sepa-instant,swish,mobilepay,ideal,bizum,ev"
      CDK_BRANCH_PROCESSOR_PAYOUT_AUTOSIM: "true"
      CDK_BRANCH_PROCESSOR_EV_FLEET: "atomA,atomB,atomC,atomD,atomV"
      CDK_BRANCH_PROCESSOR_EV_GATEWAY_URL: "http://127.0.0.1:8099"
      CDK_BRANCH_PROCESSOR_EV_GATEWAY_KEY: "${PECAN_EV_GATEWAY_KEY:?set in .env}"
    volumes:
      - /opt/pecan-nok-data:/var/lib/cdk-branch-processor
      - /opt/pecan-nok-config:/var/lib/pecan/config
      - /opt/inr2-swapnet/cln-swap-data:/run/pecan-cln
    env_file: .env
    logging:
      driver: json-file
    restart: unless-stopped
