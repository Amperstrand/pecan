# Builds and publishes the multi-arch image to GHCR.
#
#   push to main → ghcr.io/zeugmaster/custom-unit-mint:edge
#   tag vX.Y.Z   → :vX.Y.Z + :latest, then a GitHub Release
#
# Each architecture builds natively (QEMU would take hours for the full cdk
# compile); the merge job stitches the per-arch digests into one manifest.
# The GitHub Release — which install.sh resolves — is created only after the
# manifest exists and the smoke test passed, so the installer can never pick
# up a version whose image is missing or broken.
#
# One-time manual step after the first successful run: set the GHCR package
# to Public (github.com → profile → Packages → custom-unit-mint → settings),
# otherwise anonymous `docker pull` and the installer fail.

name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/zeugmaster/custom-unit-mint

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Registry layer cache, one ref per arch: the gha cache backend's
          # 10 GB cap cannot hold two architectures of Rust layers.
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_args=()
          for digest in *; do
            digest_args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
      - name: Inspect
        run: |
          for tag in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools inspect "$tag"
          done

  # Boots the just-published manifest with the production compose file and
  # walks the full first-run path: healthz → login with the injected initial
  # password → add the first unit → mint leaves Standby and serves /v1/info.
  smoke:
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot the published image
        run: |
          PW="smoke-$(openssl rand -hex 8)"
          echo "SMOKE_PW=$PW" >> "$GITHUB_ENV"
          cat > .env <<EOF
          VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
          INITIAL_ADMIN_PASSWORD=$PW
          EOF
          docker compose -f docker-compose.yml pull --quiet
          docker compose -f docker-compose.yml up -d
      - name: Processor becomes healthy
        run: curl --retry 60 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:9090/healthz
      - name: First unit starts the mint
        run: |
          curl -fsS -c /tmp/smoke-cookies -X POST http://127.0.0.1:9090/api/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$SMOKE_PW\"}"
          curl -fsS -b /tmp/smoke-cookies -X POST http://127.0.0.1:9090/api/units \
            -H 'content-type: application/json' \
            -d '{"unit":"smoke","keyset_lifetime_days":90,"rotate_before_expiry_days":14,"input_fee_ppk":0,"amounts":"1,2,4,8,16,32,64"}'
          # The processor exits to apply the change; Docker restarts it and
          # the supervisor starts cdk-mintd.
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8089/v1/info >/dev/null 2>&1; then
              echo "mint is up"
              exit 0
            fi
            sleep 2
          done
          echo "mint never came up" >&2
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs

  release:
    needs: [merge, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
