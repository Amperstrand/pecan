# Builds and publishes the multi-arch image to GHCR.
#
#   push to main → ghcr.io/zeugmaster/pecan:edge
#   tag vX.Y.Z   → :vX.Y.Z + :latest, then a GitHub Release
#
# Each architecture builds natively (QEMU emulation is painfully slow for
# Rust); the merge job stitches the per-arch digests into one manifest.
# The GitHub Release — which install.sh resolves — is created only after the
# manifest exists and the smoke test passed, so the installer can never pick
# up a version whose image is missing or broken.
#
# One-time manual step after the first successful run: set the GHCR package
# to Public (github.com → profile → Packages → pecan → settings),
# otherwise anonymous `docker pull` and the installer fail.

name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/zeugmaster/pecan

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Registry layer cache, one ref per arch: the gha cache backend's
          # 10 GB cap cannot hold two architectures of Rust layers.
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # mintctl release binaries: static musl on Linux (runs on any distro/libc),
  # native on macOS. Built on every push to catch breakage early; attached to
  # the GitHub Release on tags, where install.sh downloads them.
  mintctl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: mintctl-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: mintctl-linux-arm64
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: mintctl-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mintctl
          key: ${{ matrix.target }}
      - name: Build
        working-directory: mintctl
        env:
          MINTCTL_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/mintctl" "${{ runner.temp }}/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_args=()
          for digest in *; do
            digest_args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
      - name: Inspect
        run: |
          for tag in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools inspect "$tag"
          done

  # Installs the just-published manifest through the REAL installer (the
  # mintctl binary built in this run) and walks the first-run path: install →
  # forced password change gates the console → new password → attachment
  # setup produces the checklist + snippet → the self-test fails gracefully
  # against an unreachable mint. (Full mint↔processor integration runs in
  # smoke-mint below, against the official cashubtc/mintd image.)
  smoke:
    needs: [merge, mintctl]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: mintctl-linux-amd64
      - name: Install via mintctl
        run: |
          chmod +x mintctl-linux-amd64
          ./mintctl-linux-amd64 install --yes --plain-http \
            --dir "$RUNNER_TEMP/branch-a" \
            --version "${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}" \
            --artifacts-dir . | tee install.log
          # The generated readable passphrase is the first-boot credential.
          PW=$(sed -n 's/^INITIAL_ADMIN_PASSWORD=//p' "$RUNNER_TEMP/branch-a/.env")
          test -n "$PW"
          echo "::add-mask::$PW"
          echo "SMOKE_PW=$PW" >> "$GITHUB_ENV"
      - name: Forced password change gates the console
        run: |
          # Sign-in with the installer password reports the forced change.
          curl -fsS -c /tmp/smoke-cookies -X POST http://127.0.0.1:9090/api/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$SMOKE_PW\"}" \
            | jq -e '.must_change_password == true'
          # Mutations are locked until a real password is set.
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/smoke-cookies \
            -X POST http://127.0.0.1:9090/api/settings/attachment \
            -H 'content-type: application/json' \
            -d '{"unit":"nope","mint_url":"http://127.0.0.1:9","advertised_grpc":"127.0.0.1:50051"}')
          test "$code" = "403"
          curl -fsS -b /tmp/smoke-cookies -X POST http://127.0.0.1:9090/api/me/password \
            -H 'content-type: application/json' \
            -d "{\"current_password\":\"$SMOKE_PW\",\"password\":\"smoke-chosen-pw-1\",\"password_confirm\":\"smoke-chosen-pw-1\"}"
      - name: Attachment setup produces the checklist and snippet
        run: |
          curl -fsS -b /tmp/smoke-cookies -X POST http://127.0.0.1:9090/api/settings/attachment \
            -H 'content-type: application/json' \
            -d '{"unit":"smoke","mint_url":"http://127.0.0.1:9","advertised_grpc":"127.0.0.1:50051"}'
          curl -fsS -b /tmp/smoke-cookies http://127.0.0.1:9090/api/app > /tmp/smoke-app.json
          jq -e '.setup.setup_complete == true
                 and .setup.unit == "smoke"
                 and (.snippet | type == "string" and contains("[[payment_backend]]") and contains("grpcprocessor") and contains("unit = \"smoke\""))
                 and (.checklist | length == 5)' /tmp/smoke-app.json
          # Port 9 is closed: the reachability check must fail loudly, with a remedy.
          jq -e '.checklist[] | select(.id == "reachable") | .status == "fail" and (.remedy | type == "string")' /tmp/smoke-app.json
      - name: Self-test fails gracefully against an unreachable mint
        run: |
          curl -fsS -b /tmp/smoke-cookies -X POST http://127.0.0.1:9090/api/mint/self-test \
            | jq -e '.ok == false and .deposit.ok == false'
      - name: Logs on failure
        if: failure()
        run: |
          cat install.log 2>/dev/null || true
          docker compose -f "$RUNNER_TEMP/branch-a/docker-compose.yml" --project-directory "$RUNNER_TEMP/branch-a" logs || true

  # The bundled-mint first-run path, end to end against the REAL official
  # cashubtc/mintd image: headless --with-mint install → mint config-inits and
  # serves the unit → the pre-seeded attachment + auto self-test turn the
  # checklist green and lock the unit with zero interaction → backup carries
  # the mint. --mint-url overrides the derived URL because GitHub runners are
  # NATed (the detected egress IP is not bound on the VM).
  smoke-mint:
    needs: [merge, mintctl]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: mintctl-linux-amd64
      - name: Install with the bundled mint
        run: |
          chmod +x mintctl-linux-amd64
          ./mintctl-linux-amd64 install --yes --plain-http --with-mint \
            --unit smoke --mint-url http://mintd:8085 \
            --dir "$RUNNER_TEMP/branch-mint" \
            --version "${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}" \
            --artifacts-dir . | tee install.log
          PW=$(sed -n 's/^INITIAL_ADMIN_PASSWORD=//p' "$RUNNER_TEMP/branch-mint/.env")
          test -n "$PW"
          echo "::add-mask::$PW"
          echo "SMOKE_PW=$PW" >> "$GITHUB_ENV"
      - name: Seed file is written safely
        run: |
          f="$RUNNER_TEMP/branch-mint/mint/mnemonic"
          test "$(stat -c %a "$f")" = "600"
          test "$(wc -w < "$f")" -eq 12
      - name: Mint serves the unit
        run: |
          curl -fsS http://127.0.0.1:3338/v1/info | jq -e \
            '.nuts."4".methods | map(select(.unit == "smoke")) | length > 0'
          curl -fsS http://127.0.0.1:3338/v1/keysets | jq -e \
            '.keysets | map(select(.unit == "smoke")) | length > 0'
      - name: Checklist settles green and the unit locks
        run: |
          curl -fsS -c /tmp/smoke-cookies -X POST http://127.0.0.1:9090/api/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$SMOKE_PW\"}"
          curl -fsS -b /tmp/smoke-cookies -X POST http://127.0.0.1:9090/api/me/password \
            -H 'content-type: application/json' \
            -d "{\"current_password\":\"$SMOKE_PW\",\"password\":\"smoke-chosen-pw-1\",\"password_confirm\":\"smoke-chosen-pw-1\"}"
          ok=""
          for i in $(seq 1 40); do
            curl -fsS -b /tmp/smoke-cookies http://127.0.0.1:9090/api/app > /tmp/smoke-app.json || true
            if jq -e '.setup.unit_locked == true
                      and ([.checklist[].status] | all(. == "ok"))' /tmp/smoke-app.json >/dev/null; then
              ok=1; break
            fi
            sleep 3
          done
          test -n "$ok" || { cat /tmp/smoke-app.json; exit 1; }
      - name: Self-test rerun passes end to end
        run: |
          curl -fsS -b /tmp/smoke-cookies -X POST http://127.0.0.1:9090/api/mint/self-test \
            | jq -e '.ok == true'
      - name: Backup includes the mint
        run: |
          "$RUNNER_TEMP/branch-mint/mintctl" backup /tmp/smoke-backup.tar.gz
          tar tzf /tmp/smoke-backup.tar.gz | grep -q '^mint-data'
          tar tzf /tmp/smoke-backup.tar.gz | grep -q '^install/mint/mnemonic'
      - name: Logs on failure
        if: failure()
        run: |
          cat install.log 2>/dev/null || true
          docker compose -f "$RUNNER_TEMP/branch-mint/docker-compose.yml" --project-directory "$RUNNER_TEMP/branch-mint" logs || true

  release:
    needs: [merge, smoke, smoke-mint, mintctl]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/binaries
          pattern: mintctl-*
          merge-multiple: true
      - name: Create the GitHub Release with mintctl binaries
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/binaries
        run: |
          sha256sum mintctl-* > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            mintctl-* SHA256SUMS
