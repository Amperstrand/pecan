name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # tsc -b inside the build script is the type gate.
      - run: npm run build
        working-directory: web

  processor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: processor
      - run: cargo build --locked
        working-directory: processor
      - run: cargo test --locked
        working-directory: processor

  mintctl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mintctl
      - run: cargo build --locked
        working-directory: mintctl
      - run: cargo test --locked
        working-directory: mintctl
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: mintctl

  # The three places naming the compatible cdk revision must agree — the
  # payment-processor protocol check between mint and processor is
  # strict-equality, so a drifted pin ships a broken pairing.
  pin-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cdk rev pins agree
        run: |
          CDK_REV=$(sed -n 's/^ARG CDK_REV=//p' docker/mintd/Dockerfile)
          test -n "$CDK_REV"
          grep -q "rev = \"$CDK_REV\"" processor/Cargo.toml
          grep -q "$CDK_REV" processor/src/config.rs

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
