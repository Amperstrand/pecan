name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      # tsc -b inside the build script is the type gate.
      - run: npm run build
        working-directory: web

  processor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: processor
      - run: cargo build --locked
        working-directory: processor
      - run: cargo test --locked
        working-directory: processor

  mintctl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mintctl
      - run: cargo build --locked
        working-directory: mintctl
      - run: cargo test --locked
        working-directory: mintctl
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: mintctl

  # The compatible cdk version must agree everywhere it appears — the
  # payment-processor protocol check between mint and processor is
  # strict-equality, so a drifted pin ships a broken pairing.
  pin-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cdk version pins agree
        run: |
          CDK_VERSION=$(sed -n 's/^pub const COMPATIBLE_CDK_VERSION: &str = "\(.*\)";$/\1/p' processor/src/config.rs)
          test -n "$CDK_VERSION"
          grep -q "version = \"=$CDK_VERSION\"" processor/Cargo.toml
          grep -q "MINTD_DEFAULT_TAG: &str = \"$CDK_VERSION\"" mintctl/src/mint.rs
          # Every literal mintd image tag in the repo (bare or as the
          # ${MINT_VERSION:-...} compose default) must equal the compatible
          # version. Tags start with a digit, so interpolations like
          # cashubtc/mintd:{COMPATIBLE_CDK_VERSION} are naturally skipped.
          tags=$(grep -rhoE 'cashubtc/mintd:(\$\{MINT_VERSION:-)?[0-9][A-Za-z0-9.-]*' \
                   --include="*.yml" --include="*.yaml" --include="*.rs" --include="*.toml" \
                   --include="*.md" --include=".env.example" . \
                 | sed -E 's|^cashubtc/mintd:(\$\{MINT_VERSION:-)?||' | sort -u)
          test -n "$tags"
          for tag in $tags; do
            if [ "$tag" != "$CDK_VERSION" ]; then
              echo "cashubtc/mintd tag '$tag' disagrees with COMPATIBLE_CDK_VERSION=$CDK_VERSION" >&2
              exit 1
            fi
          done

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh

  sensitive-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-sensitive.sh
