# Reference cdk-mintd configuration for the Custom Unit Mint. The default
# deploy does NOT read this file — the processor generates mint.toml from the
# console-managed configuration: one [[ln]] + [grpc_processor.unit_keysets.*]
# entry per non-retired unit. A fresh install has none until the operator adds
# the first unit, and cdk-mintd refuses to start without a payment backend, so
# the supervisor keeps the mint offline until then.
#
# Every key except [grpc_processor.unit_keysets.*] is a stock cdk option; the
# unit_keysets blocks (per-unit denominations, input fee, and initial keyset
# expiry) are added by patches/cdk-managed-units.patch. The mint is made
# specific to a custom unit (ora, in this example) by pointing its gRPC
# payment backend at our processor.

[info]
url = "http://localhost:8089"
listen_host = "0.0.0.0"
listen_port = 8089
# Embedded signatory seed. Keyset final_expiry is enforced natively by the mint
# (cdk: ecash from an expired keyset is rejected with ExpiredKeyset / 12003), so
# no external/custom signatory is needed.
#
# !!! DEMO SEED — replace before any non-throwaway use. Anyone with this seed
# !!! can forge the mint's keys.
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

[info.http_cache]
backend = "memory"
ttl = 60
tti = 60

# Seeds a fresh mint database; the processor also asserts these over the
# management RPC on every boot (QuoteTTL is DB-persisted). Wallet-created
# quotes live this long before the expiry sweep reclaims them.
[info.quote_ttl]
mint_ttl = 1800
melt_ttl = 900

[mint_info]
name = "Custom Unit Mint"
description = "Cashu mint for a custom unit (ora). Wallets create locked quotes; a branch operator settles them by quote id."
description_long = "Demonstrates cdk-mintd (with the managed-units patch) plumbed against a custom gRPC payment processor implementing the 'branch' method (manual cash settlement at a counter). Keyset expiry is enforced natively by the mint."

[database]
engine = "sqlite"

# Route the custom unit "ora" to our processor instead of a Lightning backend.
# The generated config writes one such entry per non-retired unit.
[[ln]]
ln_backend = "grpcprocessor"
unit = "ora"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[grpc_processor]
supported_units = ["ora"]
# docker-compose service name; plaintext on the compose-internal network.
addr = "http://processor"
port = 50051

# Patch-added: per-unit keyset parameters applied at registration.
[grpc_processor.unit_keysets.ora]
amounts = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
input_fee_ppk = 0
initial_final_expiry = 1785283200

# Lets the operator UI rotate keysets (and set each keyset's final_expiry).
[mint_management_rpc]
enabled = true
address = "0.0.0.0"
port = 8091

[limits]
max_inputs = 1000
max_outputs = 1000
